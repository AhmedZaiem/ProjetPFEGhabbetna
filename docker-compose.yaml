version: "3.9"

services:

  # ---------------- FRONTEND ----------------
  frontend:
    build: ./Frontend/Project_Front
    ports:
      - "3000:80"
    environment:
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - api_gateway

  # ---------------- API GATEWAY ----------------
  api_gateway:
    build: ./Backend/gateway_api
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth_service:8000
      - ADMIN_SERVICE_URL=http://admin_service:8000
      - UPLOAD_INCIDENT_SERVICE_URL=http://upload_incident_service:8000
      - BI_INCIDENT_SERVICE_URL=http://bi_incident_service:8000
    depends_on:
      - auth_service
      - admin_service
      - upload_incident_service

  # ---------------- AUTH SERVICE (NO DB) ----------------
  auth_service:
    build: ./Backend/auth_service
    ports:
      - "8001:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3000
    env_file:
      - ./Backend/auth_service/.env

    depends_on:
      - redis

  # ---------------- ADMIN SERVICE ----------------
  admin_service:
    build: ./Backend/admin_service
    ports:
      - "8002:8000"
    env_file:
      - ./Backend/admin_service/.env
    environment:
      - DATABASE_URL=postgresql://postgres:aaaa@admin_db:5432/admin_db
    depends_on:
      admin_db:
        condition: service_healthy

  admin_db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aaaa
      POSTGRES_DB: admin_db
    volumes:
      - admin_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- INCIDENT SERVICE ----------------
  upload_incident_service:
    build: ./Backend/upload_incident_service
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:aaaa@incident_db:5432/incident_db
    depends_on:
      incident_db:
        condition: service_healthy

  incident_db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aaaa
      POSTGRES_DB: incident_db
    volumes:
      - incident_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- REDIS ----------------
  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  admin_data:
  incident_data:
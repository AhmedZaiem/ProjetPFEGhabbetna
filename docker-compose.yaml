version: "3.9"

services:

  # ---------------- FRONTEND ----------------
  frontend:
    build: ./Frontend/Project_Front
    ports:
      - "3000:80"
    environment:
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - api_gateway

  # ---------------- API GATEWAY ----------------
  api_gateway:
    build: ./Backend/gateway_api
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth_service:8000
      - ADMIN_SERVICE_URL=http://admin_service:8000
      - UPLOAD_INCIDENT_SERVICE_URL=http://upload_incident_service:8000
      - BI_INCIDENT_SERVICE_URL=http://bi_incident_service:8000
    depends_on:
      - auth_service
      - admin_service
      - upload_incident_service
      - bi_incident_service

  # ---------------- AUTH SERVICE (NO DB) ----------------
  auth_service:
    build: ./Backend/auth_service
    ports:
      - "8001:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=http://localhost:3000
      - ADMIN_SERVICE_URL=http://admin_service:8000
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/security-event
    env_file:
      - ./Backend/auth_service/.env

    depends_on:
      - redis

  # ---------------- ADMIN SERVICE ----------------
  admin_service:
    build: ./Backend/admin_service
    ports:
      - "8002:8000"
    env_file:
      - ./Backend/admin_service/.env
    environment:
      - DATABASE_URL=postgresql://postgres:aaaa@admin_db:5432/admin_db
      - AUTH_SERVICE_URL=http://auth_service:8000
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      admin_db:
        condition: service_healthy

  admin_db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aaaa
      POSTGRES_DB: admin_db
    volumes:
      - admin_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- INCIDENT SERVICE ----------------
  upload_incident_service:
    build: ./Backend/upload_incident_service
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:aaaa@incident_db:5432/incident_db
      - ADMIN_SERVICE_URL=http://admin_service:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      incident_db:
        condition: service_healthy

  incident_db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aaaa
      POSTGRES_DB: incident_db
    volumes:
      - incident_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------BI INCIDENT SERVICE ----------------
  bi_incident_service:
    build: ./Backend/bi_incident_service
    ports:
      - "8004:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:aaaa@bi_database:5432/bi_database
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADMIN_SERVICE_URL=http://admin_service:8000
    depends_on:
      bi_database:
        condition: service_healthy
  
  bi_database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aaaa
      POSTGRES_DB: bi_database
    volumes:
      - bi_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
  
  # ---------------- AI SECURITY SERVICE -------

  ai_security_service:
    build: ./Backend/ai_security_service
    ports:
      - "8006:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:aaaa@ai_security_db:5432/ai_security_db
    depends_on:
      ai_security_db:
        condition: service_healthy

  ai_security_db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aaaa
      POSTGRES_DB: ai_security_db
    volumes:
      - ai_security_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- REDIS ----------------
  redis:
    image: redis:7
    ports:
      - "6380:6379"

  # ---------------- N8N ----------------
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - ai_security_db

volumes:
  admin_data:
  incident_data:
  bi_data:
  ai_security_data:
  n8n_data: